<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FloodMesh | Street-level flood monitoring for Edison, NJ</title>
  <meta name="description" content="Live street-level flood readings, community reports, and home water alerts for Edison, New Jersey.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230e2a3f'/%3E%3Cpath d='M5 8h14M5 12h10M5 16h6' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="FloodMesh home">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <rect width="24" height="24" rx="5" fill="#0e2a3f"/>
        <path d="M5 8h14M5 12h10M5 16h6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <span>FloodMesh</span>
    </a>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <button class="tab" data-view="public">Map</button>
      <button class="tab" data-view="home">My home</button>
      <button class="tab" data-view="municipal" id="tab-municipal" hidden>Municipal</button>
    </nav>
    <div class="topbar-right">
      <div class="replay-status" id="replay-status" hidden></div>
      <button class="account-btn" id="account-btn">Sign in</button>
    </div>
  </header>

  <main class="layout">
    <aside class="panel" id="panel" aria-live="polite"></aside>
    <div class="map" id="map" role="application" aria-label="Map of sensors and reports"></div>
  </main>

  <section class="demo" id="demo" hidden aria-label="Demo controls"></section>
  <div class="notice-stack" id="notice-stack" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
